# Homelab deployment (ADR 9): a git-backed Dockhand stack, like llm-gateway.
# The homelab's shared cloudflared publishes https://cast.bhayanak.net -> http://${HOST_BIND}:${HOST_PORT},
# so this stack has no tunnel of its own. Setup, env vars and checklist: docs/deploy.md.
#   docker compose up -d --build
# Logs: `app` writes JSON lines to stdout, `vector` ships them to `victorialogs`, which keeps them
# 90 days behind a password on the LAN IP (ADR 9 addendum, docs/deploy.md "Logs").

services:
  app:
    build: .
    # Every app variable is listed here and filled by interpolation, because Dockhand's stack
    # variables (or a local .env) feed interpolation, not the container. Unset ones arrive empty,
    # which the app treats as unset; it refuses to start listing anything missing or invalid.
    # E2E_AUTH is deliberately absent: the test-only sign-in must never reach production.
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # Pasted in unencoded, so the password (and user and db name) must be URL-safe; the app refuses
      # to start otherwise (docs/deploy.md section 3).
      DATABASE_URL: postgres://${POSTGRES_USER:-bhayanakcast}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-bhayanakcast}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://cast.bhayanak.net}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${CLOUDFLARE_ANALYTICS_API_TOKEN:-}
      REALTIME_ANONYMOUS_SOCKETS_PER_IP: ${REALTIME_ANONYMOUS_SOCKETS_PER_IP:-}
      REALTIME_SOCKETS_PER_USER: ${REALTIME_SOCKETS_PER_USER:-}
      PUBLIC_READ_LIMIT_SCALE: ${PUBLIC_READ_LIMIT_SCALE:-}
      REALTIME_EMPTY_ROOM_TIMEOUT_MS: ${REALTIME_EMPTY_ROOM_TIMEOUT_MS:-}
    # How `vector` finds this container whatever the stack is called (vector/vector.yaml).
    labels:
      net.bhayanak.cast.logs: app
    # Validate the environment and apply pending migrations (src/db/migrate.ts does both, in that
    # order), then start the server. The image's default command too: keep them the same.
    command: ["sh", "-c", "node src/db/migrate.ts && exec node server.prod.ts"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      # LAN-only publish. HOST_BIND defaults to the dockhand LXC LAN IP; the shared cloudflared
      # reaches the app here, and one hostname carries both pages and /ws.
      - "${HOST_BIND:-10.1.1.160}:${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      # /api/health runs `select 1` against db, so a lost database turns the app unhealthy.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # Pinned by digest, the same as backup/Dockerfile's base so pg_dump matches the server.
    image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhayanakcast}
      # No `:?` guard (Dockhand can't stop/redeploy stacks that use it); the postgres image
      # itself refuses to initialise without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-bhayanakcast}
    # Local Docker volume, never the NAS CIFS share (ADR 9 addendum). Not published on any port.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly compressed pg_dump, rsynced to the NAS share, the last 14 days kept (ADR 9 addendum).
  # Runs once at start, then on BACKUP_SCHEDULE. Health: the last run succeeded, within
  # BACKUP_MAX_AGE_HOURS. See docs/deploy.md.
  backup:
    build: ./backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-bhayanakcast}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-bhayanakcast}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      # BACKUP_TZ, not TZ: stack variables named like Dockhand's own env can pick up its values.
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      - backups:/backups
      # The NAS directory for dumps, a CIFS volume Docker mounts itself (see `nas` below).
      - nas:/nas
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Healthy only while the last run succeeded and is under BACKUP_MAX_AGE_HOURS old.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 10m
      start_interval: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Searchable logs, kept 90 days (ADR 9 addendum, docs/deploy.md "Logs"). Diagnostic only: its
  # volume is not backed up, and a deploy that recreates `vector` loses the seconds it is down.
  # Image pinned by digest (the tag stays for readers); Dependabot opens PRs for it.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=90d
      # Basic auth on the viewer and the API, inserts included (so `vector` gets the same pair).
      # Required (`:?`): with either empty VictoriaLogs would start with no login, so the deploy
      # fails instead. `/health` stays open.
      - -httpAuth.username=${LOGS_VIEWER_USER:?set LOGS_VIEWER_USER, the log viewer needs a login (docs/deploy.md section 6)}
      - -httpAuth.password=${LOGS_VIEWER_PASSWORD:?set LOGS_VIEWER_PASSWORD, the log viewer needs a login (docs/deploy.md section 6)}
    volumes:
      - vlogs:/victoria-logs-data
    ports:
      # The viewer is http://${HOST_BIND}:9428/select/vmui/. LAN only, like the app: it is not on the
      # tunnel, and mustn't be without a Cloudflare Access application in front (docs/deploy.md).
      - "${HOST_BIND:-10.1.1.160}:9428:9428"
    # Measured: 114 MiB for 500,000 lines at a steady pace, but a bulk burst under 256 MiB was
    # OOM-killed, so not less than 512.
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Reads the app's stdout through the Docker socket and sends it to `victorialogs`, with a disk
  # buffer for when that is down. Built from vector/ (pinned base, the config baked in).
  vector:
    build: ./vector
    environment:
      # Vector expands ${...} in its config only when told to; vector.yaml uses these two.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      LOGS_VIEWER_USER: ${LOGS_VIEWER_USER:?set LOGS_VIEWER_USER, the log viewer needs a login (docs/deploy.md section 6)}
      LOGS_VIEWER_PASSWORD: ${LOGS_VIEWER_PASSWORD:?set LOGS_VIEWER_PASSWORD, the log viewer needs a login (docs/deploy.md section 6)}
    volumes:
      # Root-equivalent on the host (a read-only mount doesn't limit the Docker API); the trade-off is
      # accepted (docs/deploy.md, "Logs").
      - /var/run/docker.sock:/var/run/docker.sock
      - vectordata:/var/lib/vector
    depends_on:
      - victorialogs
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  backups:
  # Logs and Vector's disk buffer: local volumes, not on the NAS and not in the backups.
  vlogs:
  vectordata:
  # The NAS directory for dumps, mounted by Docker whenever `backup` starts, so it needs no host
  # mount and survives reboots. If the share is unreachable, `backup` doesn't start rather than
  # writing to local disk. Root-only, as the dumps hold user data and session tokens. Docker fixes
  # these options when it creates the volume: after changing a BACKUP_NAS_* variable, remove the
  # `nas` volume (the share's files stay) and redeploy. See docs/deploy.md section 5.
  nas:
    driver: local
    driver_opts:
      type: cifs
      device: ${BACKUP_NAS_SHARE:-//10.1.1.195/weyland/Services/backups/bhayanakcast}
      o: username=${BACKUP_NAS_USERNAME:-},password=${BACKUP_NAS_PASSWORD:-},vers=3.0,uid=0,gid=0,file_mode=0600,dir_mode=0700,soft,nounix
