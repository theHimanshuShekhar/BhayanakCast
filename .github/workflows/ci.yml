name: CI

# Pushes to main, and every pull request: a push to a PR branch is covered by the PR run, so
# branches aren't built twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same branch/PR supersedes the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      # Must run after pnpm/action-setup so `cache: pnpm` can find the store.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      # `check` catches a broken migration history (colliding or out-of-order snapshots);
      # `generate` finds a schema change with no migration. Neither needs a database. `generate`
      # exits 0 even when it fails (a column rename needs a prompt, and CI has no TTY), so the
      # step passes only on its "No schema changes" line, not on its exit code.
      - name: Schema and migration drift
        run: |
          pnpm exec drizzle-kit check
          out=$(pnpm exec drizzle-kit generate 2>&1) || true
          echo "$out"
          if ! grep -q "No schema changes, nothing to migrate" <<<"$out"; then
            echo "::error::src/db/schema differs from drizzle/. Run pnpm db:generate and commit the migration."
            exit 1
          fi

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # backup.sh declares its shell (busybox ash) in a `shellcheck shell=` directive.
      - name: Shellcheck (backup sidecar)
        run: docker run --rm -v "$PWD/backup:/mnt:ro" koalaman/shellcheck:v0.11.0 /mnt/backup.sh /mnt/entrypoint.sh /mnt/healthcheck.sh

      # Runs the sidecar's scripts in their image against a throwaway Postgres container.
      - name: Backup sidecar tests
        run: pnpm test:backup

      # Against a throwaway Postgres: the migration runner's advisory lock and out-of-order check,
      # and the app's queries through postgres-js on a database migrated from an older state.
      - name: Real Postgres tests (migrations, postgres-js)
        run: pnpm test:migrate
