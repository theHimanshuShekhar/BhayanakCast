name: CI

on:
  push:
  pull_request:

# A newer run on the same branch/PR supersedes the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      # Must run after pnpm/action-setup so `cache: pnpm` can find the store.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # backup.sh declares its shell (busybox ash) in a `shellcheck shell=` directive.
      - name: Shellcheck (backup sidecar)
        run: docker run --rm -v "$PWD/backup:/mnt:ro" koalaman/shellcheck:v0.11.0 /mnt/backup.sh /mnt/entrypoint.sh /mnt/healthcheck.sh

      # Runs the sidecar's scripts in their image against a throwaway Postgres container.
      - name: Backup sidecar tests
        run: pnpm test:backup

      # The migration runner's advisory lock and out-of-order check, against a throwaway Postgres.
      - name: Migration runner tests
        run: pnpm test:migrate
