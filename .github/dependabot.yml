version: 2

# Container image pins (issue #83): bumps the digests in the Dockerfiles and docker-compose.yml.
# Ticket #84 adds `npm` and `github-actions` entries to this list; add them below the images.
# Pinned images and how to bump them by hand: docs/deploy.md ("Pinned images").
updates:
  # Dockerfile: the app image's node base.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime major follows .nvmrc and package.json `engines`; move those on purpose.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # backup/Dockerfile: the postgres base of the backup sidecar.
  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
    ignore:
      # pg_dump's major must equal the db service's; a major bump moves the data too (ADR 9).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # docker-compose.yml: the db service's postgres. Keep its digest equal to backup/Dockerfile's;
  # merge the two postgres PRs together.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
