version: 2

# Container image pins (issue #83): bumps the digests in the Dockerfiles and docker-compose.yml.
# The `npm` and `github-actions` entries (ticket #84) follow the images.
# Pinned images and how to bump them by hand: docs/deploy.md ("Pinned images").
updates:
  # Dockerfile: the app image's node base.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The runtime major follows .nvmrc and package.json `engines`; move those on purpose.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # backup/Dockerfile: the postgres base of the backup sidecar.
  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
    ignore:
      # pg_dump's major must equal the db service's; a major bump moves the data too (ADR 9).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # docker-compose.yml: the db service's postgres. Keep its digest equal to backup/Dockerfile's;
  # merge the two postgres PRs together.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # package.json and pnpm-lock.yaml. Minor and patch bumps arrive as one PR a week; a major gets its
  # own, so it can be read and tested alone. Node itself follows .nvmrc and `engines`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # .github/workflows: the actions' versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
