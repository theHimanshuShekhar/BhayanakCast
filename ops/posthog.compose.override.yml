# Apply this after PostHog's pinned docker-compose.hobby.yml. It deliberately
# disables PostHog's public Caddy origin and gives BhayanakCast a private alias.
services:
  web:
    ports: !override
      - "127.0.0.1:${POSTHOG_ADMIN_PORT:-8000}:8000"
    networks:
      default:
      analytics:
        aliases:
          - posthog
  caddy:
    profiles:
      - public-posthog-disabled

networks:
  analytics:
    name: ${POSTHOG_NETWORK:-bhayanakcast-analytics}
    external: true
